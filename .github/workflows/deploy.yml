name: Deploy to Hugging Face Spaces

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync-to-space:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git remote add space https://nikki2661:$HF_TOKEN@huggingface.co/spaces/nikki2661/credit-risk-assessment || git remote set-url space https://nikki2661:$HF_TOKEN@huggingface.co/spaces/nikki2661/credit-risk-assessment
          git push --force space main
